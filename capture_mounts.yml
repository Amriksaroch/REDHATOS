---
- name: Capture mount entries (human readable)
  hosts: rhel
  become: true
  gather_facts: true
  gather_subset:
    - mounts

  vars:
    report_dir: "{{ playbook_dir }}/mount_reports"
    timestamp: "{{ lookup('pipe', 'date +%Y%m%d_%H%M%S') }}"

  tasks:
    - name: Get /etc/fstab entries as a table
      ansible.builtin.shell: grep -Ev '^\s*(#|$)' /etc/fstab | column -t
      register: fstab_out
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Build the report
      ansible.builtin.set_fact:
        report: |
          ==========================================================================================
           MOUNT REPORT
           Host     : {{ inventory_hostname }} ({{ ansible_hostname }})
           OS       : {{ ansible_distribution }} {{ ansible_distribution_version }}
           Captured : {{ timestamp }}
          ==========================================================================================

           MOUNTED FILESYSTEMS
          ------------------------------------------------------------------------------------------
          {{ '%-22s %-28s %-8s %9s %9s %9s %6s' | format('MOUNT POINT', 'DEVICE', 'TYPE', 'SIZE', 'USED', 'FREE', 'USE%') }}
          ------------------------------------------------------------------------------------------
          {% for m in ansible_mounts | sort(attribute='mount') %}
          {% set total = m.size_total | default(0) %}
          {% set free = m.size_available | default(0) %}
          {% set used = total - free %}
          {% set pct = ((used / total * 100) | round(1)) if total > 0 else 0 %}
          {{ '%-22s %-28s %-8s %7.1fGB %7.1fGB %7.1fGB %5.1f%%' | format(m.mount, m.device, m.fstype, total / 1073741824, used / 1073741824, free / 1073741824, pct) }}
          {% endfor %}

          ------------------------------------------------------------------------------------------
           MOUNT OPTIONS
          ------------------------------------------------------------------------------------------
          {% for m in ansible_mounts | sort(attribute='mount') %}
          {{ '%-22s %s' | format(m.mount, m.options) }}
          {% endfor %}

          ------------------------------------------------------------------------------------------
           /etc/fstab ENTRIES (device  mountpoint  fstype  options  dump  pass)
          ------------------------------------------------------------------------------------------
          {{ fstab_out.stdout }}
          ==========================================================================================

    - name: Print report in console
      ansible.builtin.debug:
        msg: "{{ report.split('\n') }}"

    - name: Create report directory on Jenkins
      ansible.builtin.file:
        path: "{{ report_dir }}"
        state: directory
        mode: "0755"
      delegate_to: localhost
      become: false
      run_once: true

    - name: Save report on Jenkins server
      ansible.builtin.copy:
        dest: "{{ report_dir }}/{{ inventory_hostname }}_mounts_{{ timestamp }}.txt"
        content: "{{ report }}"
        mode: "0644"
      delegate_to: localhost
      become: false
      check_mode: false
