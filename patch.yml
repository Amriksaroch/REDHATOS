---
- name: Patch RHEL server
  hosts: rhel
  become: true
  gather_facts: true

  tasks:
    - name: Show current kernel
      ansible.builtin.command: uname -r
      register: old_kernel
      changed_when: false

    - name: Print current kernel
      ansible.builtin.debug:
        msg: "Current kernel: {{ old_kernel.stdout }}"

    - name: Apply all updates
      ansible.builtin.dnf:
        name: "*"
        state: latest
        update_cache: true
      register: patch_result
      async: 3600        # allow up to 1 hour
      poll: 15           # check every 15s

    - name: Show updated packages
      ansible.builtin.debug:
        var: patch_result.results

    - name: Check if reboot is needed
      ansible.builtin.command: needs-restarting -r
      register: reboot_required
      failed_when: false
      changed_when: reboot_required.rc == 1

    - name: Reboot if required
      ansible.builtin.reboot:
        reboot_timeout: 900
      when: reboot_required.rc == 1

    - name: Show kernel after patching
      ansible.builtin.command: uname -r
      register: new_kernel
      changed_when: false

    - name: Print new kernel
      ansible.builtin.debug:
        msg: "Kernel after patching: {{ new_kernel.stdout }}"
